<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Поддержать — Тапёр</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #15161C; color: #ECEDF2;
    font: 16px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
    padding: 32px 16px; box-sizing: border-box;
  }
  .block {
    width: 100%; max-width: 440px;
    background: #181A21; border: 1px solid #23252F; border-radius: 14px; padding: 20px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
  .note { color: #9EA2B0; font-size: 14px; margin: 0 0 18px; }
  label { display: block; font-size: 13px; color: #8A8E9C; margin: 0 0 6px; }
  .field {
    width: 100%; box-sizing: border-box;
    background: #1E2029; border: 1px solid #2C2F3A; border-radius: 10px;
    padding: 12px 13px; color: #ECEDF2; font: inherit; font-size: 15px; min-height: 48px;
  }
  .field:focus { outline: none; border-color: #9B87FF; }
  .btn {
    display: block; width: 100%; box-sizing: border-box; margin-top: 16px;
    font: inherit; font-weight: 600; font-size: 16px; text-align: center;
    color: #15161C; background: #9B87FF; border: 0; border-radius: 10px;
    padding: 14px; min-height: 52px; cursor: pointer;
  }
  .btn:hover { background: #B9A9FF; }
</style>
</head>
<body>
  <div class="block">
    <h1>Просто поддержать</h1>
    <p class="note">Перевод на ЮMoney. Между кошельками — без комиссии.</p>

    <form method="POST" action="https://yoomoney.ru/quickpay/confirm.xml" accept-charset="utf-8">
      <input type="hidden" name="receiver" value="410011529262377">
      <input type="hidden" name="quickpay-form" value="donate">
      <input type="hidden" name="targets" value="Поддержать стрим">
      <input type="hidden" name="label" value="tapyor">
      <input type="hidden" name="need-fio" value="false">
      <input type="hidden" name="need-email" value="false">
      <input type="hidden" name="need-phone" value="false">
      <input type="hidden" name="need-address" value="false">

      <label for="sum">Сумма, ₽</label>
      <input class="field" id="sum" name="sum" value="100" inputmode="numeric" data-type="number">

      <button class="btn" type="submit">Перевести</button>
    </form>
  </div>
</body>
</html>
